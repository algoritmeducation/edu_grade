<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGrade 360 | 3-Bosqichli Imtihon va Baholash Tizimi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260728_v7">
</head>
<body class="theme-dark">
  <!-- Application Navigation Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div class="brand-info">
        <h1>EduGrade <span>360</span></h1>
        <p class="tagline">3-Bosqichli Imtihon va Baholash Tizimi</p>
      </div>
    </div>

    <!-- Staff Portal & User Controls -->
    <div class="header-right">
      <div id="headerNavControl">
        <!-- Dynamic Staff Portal Login / Nav button managed by app.js -->
      </div>

      <div id="currentUserBadge" class="user-profile-badge">
        <!-- Dynamic user badge filled by app.js -->
      </div>

      <button id="resetDemoBtn" class="btn btn-ghost btn-sm" title="Barcha demo ma'lumotlarni boshlang'ich holatga tiklash">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Ma'lumotlarni tiklash
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="mainContent" class="app-content">
    <!-- Dynamic views injected via JS -->
  </main>

  <!-- Modal Overlay -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-card" id="modalCard">
      <button id="modalCloseBtn" class="modal-close-btn">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- JavaScript Scripts -->
  <script src="js/icons.js?v=20260728_v7"></script>
  <script src="js/store.js?v=20260728_v7"></script>
  <script src="js/security.js?v=20260728_v7"></script>
  <script src="js/views/studentView.js?v=20260728_v7"></script>
  <script src="js/views/adminView.js?v=20260728_v7"></script>
  <script src="js/views/examinerView.js?v=20260728_v7"></script>
  <script src="js/views/teacherView.js?v=20260728_v7"></script>
  <script src="js/views/facultyView.js?v=20260728_v7"></script>
  <script src="js/views/loginView.js?v=20260728_v7"></script>
  <script src="js/app.js?v=20260728_v7"></script>
</body>
</html>
